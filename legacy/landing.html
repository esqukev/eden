        <img class="soundctuary" src="Letra Blanco (1).ico"/>

    <main class="">
    <div class="profile_box_user">
        <form action="#" class="formulario" id="formulario">
            <!-- GRUPO DE EMAIL-->
            <div class="formulario__grupo" id="grupo__nombre">
                <label class="formulario__label">Ingresar</label>
                <label class="formulario__label_email">Email</label>
                <div class="formulario__grupo-input">
                    <input type="email" class="formulario__input" name="correo" id="correo"  placeholder="" onfocusout="validarEmail()">
                    <i class="formulario__validacion-estado fas fa-times-circle"></i>
                </div>
                <p id='correo_error'class="formulario__input-error_inactivo">El correo ingresado no es un formato válido.</p>
            </div>
    
            <!-- GRUPO DE CONTRASEÑA -->
            <div class="formulario__grupo" id="grupo__contraseña">
                <label class="formulario__label_contraseña">Contraseña</label>
                <div class="formulario__grupo-input">
                    <input type="password" class="formulario__input" name="contraseña" id="contraseña" placeholder="" onfocusout="validarClave()">
                    <i class="formulario__validacion-estado fas fa-times-circle"></i>
                </div>
                <p id="clave_error" class="formulario__input-error_inactivo">Su contraseña no coincide </p>
                <div class="formulario__grupo" id="grupo__contraseña">
                    <label class="formulario__crear">Crear cuenta</label>
                    <div class="formulario__grupo-input">
                <div class="formulario__grupo" id="grupo__contraseña">
                    <label class="formulario__recuperar">Olvidé mi contraseña</label>
                    <div class="formulario__grupo-input">
            </div>
    
            <!-- MENSAJE DE CAMPOS REQUERIDOS -->
            <div class="formulario__mensaje" id="formulario__mensaje">
                <p><i class="fas fa-exclamation-circle"> <b>Error:</b> Debes completar todos los campos</i></p>
            </div>
    
    
            <!-- GRUPO ENVIAR -->
            <div class="formulario__grupo formulario__grupo-btn-enviar">
                <p class="formulario__mensaje-exito" id="formulario__mensaje-exito">El formulario se envió correctamente</p>
                <input class="formulario__btn" type="submit" value="Iniciar sesión">
            </div>
            
        </form>
    </div>
    <div></div>
    <div></div>
    </main>
